<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>깜짝 선물</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.15s;
        }

        #main-btn {
            position: relative;
            z-index: 9999;

            padding: 26px 54px;

            border: 4px solid #fff;
            border-radius: 22px;

            background: #ff0055;
            color: white;

            font-size: 32px;
            font-weight: bold;

            box-shadow: 0 10px 0 #9b0033;

            cursor: pointer;
            user-select: none;
        }

        #main-btn:active {
            transform: translateY(4px);
            box-shadow: 0 5px 0 #9b0033;
        }

        .msg-box {
            position: fixed;
            top: 10%;
            left: 0;

            width: 100%;

            text-align: center;

            color: white;

            font-size: 2rem;
            font-weight: 900;

            text-shadow: 2px 2px 5px #000;

            z-index: 999;
            padding: 0 16px;
        }

        .friend-face {
            position: absolute;

            width: 120px;
            height: 120px;

            border-radius: 50%;
            border: 4px solid #00ff66;

            object-fit: cover;

            pointer-events: none;

            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%   { transform: translate(1px, 1px) rotate(0deg); }
            25%  { transform: translate(-2px, 2px) rotate(-1deg); }
            50%  { transform: translate(2px, -1px) rotate(1deg); }
            75%  { transform: translate(-1px, -2px) rotate(0deg); }
            100% { transform: translate(1px, 1px) rotate(1deg); }
        }

        .glitch {
            animation: shake 0.12s infinite;
        }
    </style>
</head>

<body>

<div class="msg-box" id="msg">
    절대 누르지 마시오
</div>

<button id="main-btn">
    클릭!
</button>

    const msgs = [
        "킹받쥬?",
        "못 끄쥬?",
        "또 눌렀냐?",
        "폰 안망가졌음ㅋㅋ",
        "우와아아앙!!",
        "멈출 수 없쥬?",
        "왜 계속 누름?",
        "지금 후회중?"
    ];

    const body = document.body;
    const msg = document.getElementById('msg');
    const button = document.getElementById('main-btn');

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    function changeBackground() {
        const hue = Math.floor(Math.random() * 360);

        body.style.backgroundColor =
            `hsl(${hue}, 100%, 50%)`;
    }

    function changeMessage() {
        msg.innerText =
            msgs[Math.floor(Math.random() * msgs.length)];
    }

    function createFace() {

        // 너무 많아지면 렉 걸리니까 제한
        const current =
            document.querySelectorAll('.friend-face').length;

        if (current > 60) {
            document.querySelector('.friend-face')?.remove();
        }

        const img = document.createElement('img');

        img.src = imgData;
        img.className = 'friend-face';

        img.style.left =
            random(0, window.innerWidth - 120) + 'px';

        img.style.top =
            random(0, window.innerHeight - 120) + 'px';

        img.style.transform =
            `rotate(${random(0, 360)}deg)
             scale(${random(0.6, 1.5)})`;

        document.body.appendChild(img);
    }

    function vibratePhone() {
        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    function shakeScreen() {

        body.classList.add('glitch');

        setTimeout(() => {
            body.classList.remove('glitch');
        }, 180);
    }

    function startChaos() {

        changeBackground();

        changeMessage();

        vibratePhone();

        shakeScreen();

        // 사진 여러 개 생성
        for (let i = 0; i < 4; i++) {
            createFace();
        }
    }

    // 모바일 웹뷰 호환용
    button.addEventListener('click', startChaos);

</script>
